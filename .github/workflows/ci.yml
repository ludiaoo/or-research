name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只需要 requests：build_map.py 导入 amap_client 时需要它。
      # 不装 numpy/scipy/gurobipy/高德 key —— 核心测试必须离线可跑。
      - name: Install dependency
        run: python -m pip install --upgrade pip && python -m pip install requests

      - name: Repository tests
        run: python -m unittest discover -s tests -v

      - name: Algorithm engines self-test
        run: python scripts/algotemplates/selftest.py

      - name: Algorithm engines demo
        run: python scripts/algotemplates/demo_tsp.py
